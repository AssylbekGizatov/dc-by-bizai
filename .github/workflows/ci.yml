name: Quality and demo build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: test
      ENABLE_GROQ: "false"
      ALLOW_PRIVATE_DATA_TO_GROQ: "false"
      DATABASE_PATH: /tmp/grandmobile-ci/copilot.sqlite3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            constraints.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: make setup
      - name: Unit tests, types, production UI, release hygiene
        run: make check
      - name: Real API browser scenarios (synthetic data only)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          .venv/bin/python scripts/run_e2e.py
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Build and smoke-test synthetic demo image
        run: |
          docker build -t copilot-ci .
          docker run --detach --name copilot-ci --publish 127.0.0.1:8000:8000 copilot-ci
          trap 'docker rm --force copilot-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ready
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<html'
